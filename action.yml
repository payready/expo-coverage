name: expo-coverage
description: Build the end-to-end coverage report from .expo-coverage, upload it, and summarize it on the job.
branding:
  icon: check-circle
  color: green
inputs:
  directory:
    description: Folder that holds coverage-<platform>.json files.
    default: .expo-coverage
  fail-under:
    description: Fail the job when overall line coverage is below this percentage.
    default: ''
  all:
    description: Use inventory denominator (Istanbul --all). Unloaded files count as 0%.
    default: 'false'
  artifact-name:
    description: Name of the uploaded report artifact.
    default: expo-coverage-report
  version:
    description: expo-coverage version to run when package is unset.
    default: latest
  package:
    description: Local path or npm package specifier. When set, used instead of expo-coverage@version (dogfood with ./packages/expo-coverage).
    default: ''
outputs:
  percent:
    description: Overall line coverage percentage.
    value: ${{ steps.report.outputs.percent }}
runs:
  using: composite
  steps:
    - id: report
      shell: bash
      run: |
        if [ -n "${{ inputs.package }}" ]; then
          PKG="${{ inputs.package }}"
        else
          PKG="expo-coverage@${{ inputs.version }}"
        fi
        if [ -d "$PKG" ] || [[ "$PKG" == ./* ]] || [[ "$PKG" == /* ]]; then
          RUN=(node "$PKG/dist/cli.js")
        else
          RUN=(npx --yes "$PKG")
        fi
        all_flag=""
        if [ "${{ inputs.all }}" = "true" ]; then all_flag="--all"; fi
        "${RUN[@]}" report --dir "${{ inputs.directory }}" $all_flag
        json="$("${RUN[@]}" summary --json --dir "${{ inputs.directory }}" $all_flag)"
        percent="$(echo "$json" | node -e 'process.stdin.on("data",d=>console.log(JSON.parse(d).lines.pct))')"
        echo "percent=$percent" >> "$GITHUB_OUTPUT"
        {
          echo "### End-to-end coverage: ${percent}%"
          echo
          echo '```json'
          echo "$json"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        if [ -n "${{ inputs.fail-under }}" ] && node -e 'process.exit(Number(process.argv[1]) < Number(process.argv[2]) ? 0 : 1)' "$percent" "${{ inputs.fail-under }}"; then
          echo "::error::Coverage ${percent}% is below ${{ inputs.fail-under }}%"
          exit 1
        fi
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.directory }}/report.html
