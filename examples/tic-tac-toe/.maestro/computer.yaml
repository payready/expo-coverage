appId: dev.example.tictactoe
---
- launchApp
# Dev builds can show iOS's "Open in app?" prompt on first launch.
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: "Play the computer"
    timeout: 60000
- tapOn: "Play the computer"
- tapOn:
    id: cell-0
- assertVisible: "X's turn"
- tapOn: "New game"
