# Dogfood: web + iOS + Android each upload coverage-*.json; report merges into one demo-coverage-report.
# Uses bun + example:install and the local composite action (./) so CI tests the current source.
name: demo-e2e
on:
  pull_request:
  workflow_dispatch:

env:
  EXPO_COVERAGE: '1'
  BUN_VERSION: '1.3.13'
  CI: '1'

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - run: bun run build
      - run: bun run test
      - run: bun run example:install
      - run: bunx playwright install --with-deps chromium
      - working-directory: examples/tic-tac-toe
        run: bun run coverage:web
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: examples/tic-tac-toe/.expo-coverage/coverage-web.json
          if-no-files-found: error

  ios:
    # Expo SDK 57 / expo-modules-jsi requires Swift 6.2+ (Xcode 26).
    # macos-15 defaults to Xcode 16.4 / Swift 6.1 and fails SPM resolve.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Xcode codegen script phases invoke `node`; bun alone is not enough.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select Xcode 26 (Swift 6.2+)
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$xcode" || { echo "No Xcode 26+ installed"; ls /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swift --version
      - run: bun install
      - run: bun run build
      - run: bun run example:install
      - name: Install Maestro
        run: curl -Ls https://get.maestro.mobile.dev | bash && echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Build iOS sim app and run Maestro with coverage
        run: bash examples/tic-tac-toe/scripts/ci-ios-coverage.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-ios
          path: examples/tic-tac-toe/.expo-coverage/coverage-ios.json
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bun install
      - run: bun run build
      - run: bun run example:install
      - name: Install Maestro
        run: curl -Ls https://get.maestro.mobile.dev | bash && echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build Android app, run Maestro with coverage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # Must be one line: this action runs each YAML line as its own `sh -c`.
          script: bash examples/tic-tac-toe/scripts/ci-android-coverage.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-android
          path: examples/tic-tac-toe/.expo-coverage/coverage-android.json
          if-no-files-found: error

  report:
    needs: [web, ios, android]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - run: bun run build
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: examples/tic-tac-toe/.expo-coverage
          merge-multiple: true
      - name: Require all three platform coverage files
        run: |
          set -euo pipefail
          for p in web ios android; do
            f="examples/tic-tac-toe/.expo-coverage/coverage-$p.json"
            test -s "$f" || { echo "missing $f"; ls -la examples/tic-tac-toe/.expo-coverage || true; exit 1; }
          done
      - uses: ./
        with:
          directory: examples/tic-tac-toe/.expo-coverage
          artifact-name: demo-coverage-report
          package: ./packages/expo-coverage
      - name: Validate report styles (Chromium + WebKit)
        run: |
          bunx playwright install --with-deps chromium webkit
          node scripts/validate-report.mjs "$PWD/examples/tic-tac-toe/.expo-coverage/report.html"
      - name: Confirm platform tabs in report
        run: |
          set -euo pipefail
          html="examples/tic-tac-toe/.expo-coverage/report.html"
          for label in iOS Android Web; do
            grep -q "$label" "$html" || { echo "report.html missing tab label: $label"; exit 1; }
          done
          # Platforms array alone is not enough — rehome used to drop macOS iOS paths on Linux.
          node -e '
            const html = require("fs").readFileSync("examples/tic-tac-toe/.expo-coverage/report.html", "utf8");
            const m = html.match(/"platforms":\[(.*?)\]/);
            if (!m) throw new Error("platforms array missing");
            const platforms = JSON.parse("[" + m[1] + "]");
            for (const p of ["ios", "android", "web"]) {
              if (!platforms.includes(p)) throw new Error("missing platform " + p + ": " + m[0]);
            }
            for (const p of ["ios", "android", "web"]) {
              if (!html.includes(`"${p}":{"l":`)) throw new Error("no line sums for " + p + " (rehome drop?)");
            }
            console.log("report.html has iOS/Android/Web tabs with line data:", platforms.join(","));
          '
