appId: dev.example.tictactoe
---
- launchApp
# Dev builds can show iOS's "Open in app?" prompt on first launch.
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible:
      id: cell-0
    timeout: 60000
- assertVisible: "X's turn"
- tapOn:
    id: cell-0
- tapOn:
    id: cell-3
- tapOn:
    id: cell-1
- tapOn:
    id: cell-4
- tapOn:
    id: cell-2
- assertVisible: "X wins!"
